[project]
name = "Engine"
version = "0.1.0"

[target.Engine]
type = "staticlib"
sources = ["src/**/*.cpp"]
include_dirs = ["include"]

[scripts.BuildShaders]
path     = "Scripts/BuildShaders.sh"   # required — path relative to that project's root
args     = ["--flag", "value"]      # optional — default args always passed
before   = ["build"]                # optional — run before this command/script name
required = true                     # optional, default true — abort if it fails

[[target.Engine.deps]]
name = "ECS"
path = "../ECS"

[[target.Engine.deps]]
name = "AssetManager"
path = "../AssetManager"

[[target.Engine.deps]]
name = "vk-bootstrap"
git  = "https://github.com/charles-lunarg/vk-bootstrap"

[[target.Engine.deps]]
name = "VulkanMemoryAllocator"
git  = "https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator"

[[target.Engine.deps]]
name = "vulkan-headers"
git  = "https://github.com/KhronosGroup/vulkan-headers"

[[target.Engine.deps]]
system = "glfw3"

[[target.Engine.deps]]
system = "vulkan"
